[package]
name = "swing-scanner-desktop"
version = "0.1.0"
description = "Swing Scanner desktop application"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "swing_scanner_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
uuid = { version = "1.18", features = ["v4"] }
